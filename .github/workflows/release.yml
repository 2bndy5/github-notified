name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: "*"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli & nur
        run: |
          cargo install wasm-bindgen-cli --version 0.2.108 || true
          cargo install nur || true

      - name: Run Tests (nur test)
        run: nur test || cargo test --all-targets --release

      - name: Build and Package Extensions (nur package)
        run: nur package --release || nu scripts/package.nu --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/github-notified-chromium.zip
            dist/github-notified-firefox.zip
          draft: false
          prerelease: false
          generate_release_notes: true
