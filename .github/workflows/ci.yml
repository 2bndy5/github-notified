name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Code Formatting & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        run: rustup update --no-self-update

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: cargo-lint-${{ hashfiles('Cargo.lock') }}
          path: |-
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - name: Install nur taskrunner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall nur

      - run: nur lint

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        run: rustup update --no-self-update

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: cargo-test-${{ hashfiles('Cargo.lock') }}
          path: |-
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install nur taskrunner
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall nur

      - run: nur test

  build:
    name: Build Browser Extensions (Chromium & Firefox)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust toolchain with wasm32 target
        run: |-
          rustup update --no-self-update
          rustup target add wasm32-unknown-unknown

      - name: Setup Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: "0.115.1"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: build-${{ hashfiles('Cargo.lock') }}
          path: |-
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

      - name: find wasm-bindgen version
        id: wasm-bindgen-ver
        shell: nu {0}
        run:  |-
          let ver = (
            cargo tree
            | lines
            | where { $in | str contains " wasm-bindgen " }
            | first
            | parse "{_} wasm-bindgen v{version}"
            | first
            | get version
          )
          $"version=($ver)\n" | save --append $env.GITHUB_OUTPUT

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0

      - name: Install wasm-bindgen-cli & nur
        shell: nu {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WASM_BINDGEN_VERSION: ${{ steps.wasm-bindgen-ver.outputs.version }}
        run: |
          cargo binstall wasm-bindgen-cli --version $env.WASM_BINDGEN_VERSION
          cargo binstall nur

      - run: nur package --release

      - name: Upload Chromium Extension Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-notified-chromium
          path: dist/chromium/

      - name: Upload Firefox Extension Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-notified-firefox
          path: dist/firefox/

      - name: Upload Packaged Zips
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-notified-packages
          path: dist/*.zip
