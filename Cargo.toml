[package]
name = "github-notified"
version = "0.1.0"
edition = "2021"
authors = ["github-notified contributors"]
description = "Browser extension for GitHub notifications"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gloo-net = { version = "0.7", default-features = false, features = ["http"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "WorkerGlobalScope",
    "Headers",
    "Request",
    "Response"
] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
